<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Eliminar película</title>
</head>
<body>

<h2>⚠️ ¿Seguro que deseas eliminar "{{ movie.title }}"?</h2>

<form method="post">
  {% csrf_token %}
  <button type="submit">🗑️ Sí, eliminar</button>
  <a href="{% url 'movie_detail' movie.pk %}">❌ Cancelar</a>
</form>

</body>
</html>
