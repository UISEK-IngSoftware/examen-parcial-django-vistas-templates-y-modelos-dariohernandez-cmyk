<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Películas</title>
</head>
<body>

<h1>🎬 Lista de Películas</h1>

{% if user.is_authenticated %}
  <a href="{% url 'movie_create' %}">➕ Añadir película</a>
  <a href="/auth/logout/">🚪 Salir</a>
{% else %}
  <a href="/auth/login/">🔑 Entrar</a>
{% endif %}

<hr>

<ul>
  {% for movie in movies %}
    <li>
      <a href="{% url 'movie_detail' movie.pk %}">
        {{ movie.title }}
      </a>
    </li>
  {% empty %}
    <li>No hay películas registradas</li>
  {% endfor %}
</ul>

</body>
</html>
