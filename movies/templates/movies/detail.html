<h2>{{ movie.title }}</h2>
<p>{{ movie.description }}</p>

{% if user.is_authenticated %}
  <a href="{% url 'movie_edit' movie.pk %}">✏️ Editar</a>

  <form method="post" action="{% url 'movie_delete' movie.pk %}">
    {% csrf_token %}
    <button type="submit">🗑 Eliminar</button>
  </form>
{% endif %}

<a href="{% url 'movie_list' %}">⬅ Volver</a>
